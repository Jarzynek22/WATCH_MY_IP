<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYSTEM BREACH v3.0</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #ff003c;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Efekt starego monitora CRT */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 100;
            background-size: 100% 3px, 3px 100%;
            pointer-events: none;
        }

        /* Globalne Tło Matrix (zawsze włączone, zmienia intensywność) */
        #matrix-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
            opacity: 0.15; /* Delikatne tło przed kliknięciem */
            transition: opacity 0.5s;
        }

        /* --- EKRAN POWITALNY --- */
        #welcome-screen {
            text-align: center;
            z-index: 10;
            animation: fadeIn 1s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .glitch-title {
            font-size: 48px;
            font-weight: bold;
            text-transform: uppercase;
            position: relative;
            color: #fff;
            letter-spacing: 8px;
            text-shadow: 0 0 20px #ff003c;
        }

        .glitch-title::before, .glitch-title::after {
            content: attr(data-text);
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
        }
        .glitch-title::before {
            left: 4px;
            text-shadow: -3px 0 #ff003c;
            clip: rect(24px, 550px, 90px, 0);
            animation: glitch-anim-1 2s infinite linear alternate-reverse;
        }
        .glitch-title::after {
            left: -4px;
            text-shadow: -3px 0 #00fff9;
            clip: rect(85px, 550px, 140px, 0);
            animation: glitch-anim-2 3s infinite linear alternate-reverse;
        }

        #terminal-text {
            color: #00ff00;
            font-size: 20px;
            margin-top: 30px;
            min-height: 30px;
            text-shadow: 0 0 5px #00ff00;
        }

        .cursor {
            display: inline-block;
            width: 12px;
            height: 20px;
            background: #00ff00;
            margin-left: 5px;
            animation: blink 0.7s infinite;
            vertical-align: middle;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        #enter-btn {
            margin-top: 50px;
            padding: 20px 60px;
            font-size: 28px;
            font-weight: bold;
            color: #000;
            background: #ff003c;
            border: none;
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
            text-transform: uppercase;
            letter-spacing: 4px;
            box-shadow: 0 0 30px #ff003c;
            animation: pulse-btn 1.5s infinite;
        }

        @keyframes pulse-btn {
            0% { transform: scale(1); box-shadow: 0 0 30px #ff003c; }
            50% { transform: scale(1.05); box-shadow: 0 0 60px #ff003c, 0 0 20px #fff inset; }
            100% { transform: scale(1); box-shadow: 0 0 30px #ff003c; }
        }

        /* --- EKRAN ANIMACJI (WŁAMANIE) --- */
        #animation-screen {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 20;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .glitch-wrapper {
            text-align: center;
            background: rgba(0, 0, 0, 0.85);
            padding: 50px;
            border: 2px solid #ff003c;
            box-shadow: 0 0 80px rgba(255, 0, 60, 0.6);
            width: 80%;
            max-width: 700px;
        }

        .glitch {
            font-size: 56px;
            font-weight: bold;
            text-transform: uppercase;
            position: relative;
            color: #fff;
            letter-spacing: 8px;
            margin-bottom: 30px;
        }

        .glitch::before, .glitch::after {
            content: attr(data-text);
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
        }
        .glitch::before {
            left: 4px;
            text-shadow: -3px 0 #ff003c;
            clip: rect(24px, 550px, 90px, 0);
            animation: glitch-anim-1 1.5s infinite linear alternate-reverse;
        }
        .glitch::after {
            left: -4px;
            text-shadow: -3px 0 #00fff9;
            clip: rect(85px, 550px, 140px, 0);
            animation: glitch-anim-2 2s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim-1 {
            0% { clip: rect(10px, 9999px, 30px, 0); }
            20% { clip: rect(40px, 9999px, 70px, 0); }
            40% { clip: rect(15px, 9999px, 80px, 0); }
            60% { clip: rect(60px, 9999px, 10px, 0); }
            80% { clip: rect(25px, 9999px, 50px, 0); }
            100% { clip: rect(5px, 9999px, 95px, 0); }
        }
        @keyframes glitch-anim-2 {
            0% { clip: rect(50px, 9999px, 10px, 0); }
            20% { clip: rect(20px, 9999px, 60px, 0); }
            40% { clip: rect(80px, 9999px, 5px, 0); }
            60% { clip: rect(30px, 9999px, 90px, 0); }
            80% { clip: rect(90px, 9999px, 20px, 0); }
            100% { clip: rect(60px, 9999px, 40px, 0); }
        }

        #terminal-log {
            text-align: left;
            font-size: 18px;
            color: #00ff00;
            text-shadow: 0 0 5px #00ff00;
            height: 150px;
            overflow: hidden;
            border-top: 1px solid #333;
            border-bottom: 1px solid #333;
            padding: 10px;
            background: #050505;
        }

        /* Wstrząs ekranu */
        .shake {
            animation: shake 0.2s infinite;
        }
        @keyframes shake {
            0% { transform: translate(2px, 2px) rotate(0deg); }
            10% { transform: translate(-3px, -3px) rotate(-1deg); }
            20% { transform: translate(-4px, 2px) rotate(1deg); }
            30% { transform: translate(4px, 3px) rotate(0deg); }
            40% { transform: translate(2px, -3px) rotate(1deg); }
            50% { transform: translate(-2px, 4px) rotate(-1deg); }
            60% { transform: translate(-4px, 2px) rotate(0deg); }
            70% { transform: translate(4px, 2px) rotate(-1deg); }
            80% { transform: translate(-2px, -3px) rotate(1deg); }
            90% { transform: translate(2px, 4px) rotate(0deg); }
            100% { transform: translate(2px, -2px) rotate(-1deg); }
        }

        /* --- EKRAN Z IP (PO ZŁAPANIU) --- */
        #ip-container {
            display: none;
            text-align: center;
            background: rgba(0, 0, 0, 0.95);
            border: 3px solid #ff003c;
            padding: 50px;
            box-shadow: 0 0 100px rgba(255, 0, 60, 0.4);
            z-index: 10;
            position: relative;
            width: 80%;
            max-width: 700px;
            animation: ipReveal 0.5s ease-out;
        }

        @keyframes ipReveal {
            0% { transform: scale(0.5); opacity: 0; filter: blur(10px); }
            100% { transform: scale(1); opacity: 1; filter: blur(0); }
        }

        #ip-container h2 {
            color: #ff003c;
            margin: 0 0 20px 0;
            font-size: 32px;
            letter-spacing: 5px;
            text-shadow: 0 0 20px #ff003c;
        }

        #ip-display {
            font-size: 60px;
            font-weight: bold;
            color: #fff;
            margin: 20px 0;
            letter-spacing: 6px;
            text-shadow: 0 0 30px #ff003c;
        }

        /* Pasek postępu dekodowania */
        #progress-bar-container {
            width: 100%;
            height: 20px;
            background: #111;
            border: 1px solid #ff003c;
            margin: 30px 0;
            overflow: hidden;
        }

        #progress-bar {
            height: 100%;
            width: 0%;
            background: #ff003c;
            box-shadow: 0 0 20px #ff003c;
            transition: width 0.2s linear;
        }

        #data-extraction {
            text-align: left;
            color: #00fff9;
            font-size: 16px;
            margin-top: 20px;
            opacity: 0;
            transition: opacity 1s;
        }

        .radar-ping {
            position: absolute;
            top: 50%; left: 50%;
            width: 10px; height: 10px;
            border: 2px solid #ff003c;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            animation: radarPing 2s infinite;
            z-index: -1;
        }

        @keyframes radarPing {
            0% { width: 10px; height: 10px; opacity: 1; }
            100% { width: 600px; height: 600px; opacity: 0; }
        }

    </style>
</head>
<body>

    <!-- Globalne Tło Matrix -->
    <canvas id="matrix-canvas"></canvas>

    <!-- Ekran powitalny -->
    <div id="welcome-screen">
        <div class="glitch-title" data-text="WATCH_MY_IP.EXE">WATCH_MY_IP.EXE</div>
        <div id="terminal-text"></div><span class="cursor"></span>
        <br>
        <button id="enter-btn">BREACH SYSTEM</button>
    </div>

    <!-- Ekran animacji -->
    <div id="animation-screen">
        <div class="glitch-wrapper">
            <div class="glitch" data-text="BREACHING...">BREACHING...</div>
            <div id="terminal-log"></div>
        </div>
    </div>

    <!-- Ekran z IP -->
    <div id="ip-container">
        <div class="radar-ping"></div>
        <h2>[ TARGET ACQUIRED ]</h2>
        <p style="font-size: 20px; color: #ccc;">ZŁAPANO PUBLICZNY ADRES IP:</p>
        <div id="ip-display">0.0.0.0</div>
        
        <div id="progress-bar-container">
            <div id="progress-bar"></div>
        </div>
        
        <div id="data-extraction">
            > Dekodowanie pakietów...<br>
            > Dostawca: [ENCRYPTED_DATA_STREAM]<br>
            > Status: ZŁAPANY<br>
            > Połączenie Zabezpieczone.
        </div>
    </div>

    <script>
        const welcomeScreen = document.getElementById('welcome-screen');
        const enterBtn = document.getElementById('enter-btn');
        const animationScreen = document.getElementById('animation-screen');
        const ipContainer = document.getElementById('ip-container');
        const ipDisplay = document.getElementById('ip-display');
        const terminalLog = document.getElementById('terminal-log');
        const terminalText = document.getElementById('terminal-text');
        const matrixCanvas = document.getElementById('matrix-canvas');
        const progressBar = document.getElementById('progress-bar');
        const dataExtraction = document.getElementById('data-extraction');

        // --- 1. ANIMACJA PRZED KLIKNIĘCIEM (Pisanie terminala) ---
        const welcomeMessages = ["Inicjalizacja modułów...", "Sprawdzanie portów...", "System gotowy. Naciśnij przycisk."];
        let msgIndex = 0;
        
        function typeWelcomeText() {
            if (msgIndex >= welcomeMessages.length) return;
            const text = welcomeMessages[msgIndex];
            let charIndex = 0;
            terminalText.innerText = "";
            
            const typeInterval = setInterval(() => {
                terminalText.innerText += text[charIndex];
                charIndex++;
                if (charIndex >= text.length) {
                    clearInterval(typeInterval);
                    msgIndex++;
                    setTimeout(typeWelcomeText, 1000); // Przerwa przed kolejną linijką
                }
            }, 50);
        }
        typeWelcomeText();

        // --- 2. WIELOWARSTWOWY, BRUTALNY DŹWIĘK ---
        function playTuffSound() {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const masterGain = ctx.createGain();
            masterGain.gain.value = 0.7;
            masterGain.connect(ctx.destination);

            // Głęboki bas
            const osc1 = ctx.createOscillator();
            const gain1 = ctx.createGain();
            osc1.type = 'sawtooth';
            osc1.frequency.setValueAtTime(100, ctx.currentTime);
            osc1.frequency.exponentialRampToValueAtTime(20, ctx.currentTime + 7);
            gain1.gain.setValueAtTime(0.8, ctx.currentTime);
            gain1.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 7);
            osc1.connect(gain1).connect(masterGain);
            osc1.start();
            osc1.stop(ctx.currentTime + 7);

            // Szum
            const bufferSize = ctx.sampleRate * 7;
            const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
            const noise = ctx.createBufferSource();
            noise.buffer = buffer;
            const noiseFilter = ctx.createBiquadFilter();
            noiseFilter.type = "bandpass";
            noiseFilter.frequency.value = 1000;
            const noiseGain = ctx.createGain();
            noiseGain.gain.setValueAtTime(0.0, ctx.currentTime);
            noiseGain.gain.linearRampToValueAtTime(0.3, ctx.currentTime + 1);
            noiseGain.gain.linearRampToValueAtTime(0.1, ctx.currentTime + 5);
            noiseGain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 7);
            noise.connect(noiseFilter).connect(noiseGain).connect(masterGain);
            noise.start();
            noise.stop(ctx.currentTime + 7);

            // Alarmowe pikanie
            for (let i = 0; i < 6; i++) {
                const beepTime = ctx.currentTime + i;
                const osc2 = ctx.createOscillator();
                const gain2 = ctx.createGain();
                osc2.type = 'square';
                osc2.frequency.setValueAtTime(800, beepTime);
                gain2.gain.setValueAtTime(0.15, beepTime);
                gain2.gain.exponentialRampToValueAtTime(0.001, beepTime + 0.15);
                osc2.connect(gain2).connect(masterGain);
                osc2.start(beepTime);
                osc2.stop(beepTime + 0.15);
            }
        }

        // --- LOGIKA MATRIXA (Zmienia kolor i prędkość) ---
        let matrixColor = "#333"; // Ciemny szary na start
        let matrixSpeed = 0.5;
        
        function startMatrixGlobal() {
            const ctx = matrixCanvas.getContext('2d');
            matrixCanvas.width = window.innerWidth;
            matrixCanvas.height = window.innerHeight;

            const chars = "アァカサタナハマヤャラワガザダバパイィキシチニヒミリヰギジヂビピ0123456789ABCDEF#$%&@!*";
            const fontSize = 14;
            const columns = Math.floor(matrixCanvas.width / fontSize);
            const drops = Array(columns).fill(1);

            function draw() {
                ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
                ctx.fillRect(0, 0, matrixCanvas.width, matrixCanvas.height);
                ctx.fillStyle = matrixColor;
                ctx.font = fontSize + "px monospace";

                for (let i = 0; i < drops.length; i++) {
                    const text = chars[Math.floor(Math.random() * chars.length)];
                    ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                    if (drops[i] * fontSize > matrixCanvas.height && Math.random() > 0.96) {
                        drops[i] = 0;
                    }
                    drops[i] += matrixSpeed;
                }
            }
            if (window.matrixInterval) clearInterval(window.matrixInterval);
            window.matrixInterval = setInterval(draw, 25);
        }
        startMatrixGlobal(); // Odpal od razu w tle

        // --- FAKE TERMINAL LOGI (W TRAKCIE WŁAMANIA) ---
        const logMessages = [
            "INITIALIZING EXPLOIT FRAMEWORK...",
            "SCANNING OPEN PORTS [80, 443, 8080]...",
            "BYPASSING FIREWALL... [OK]",
            "SPOOFING MAC ADDRESS... [OK]",
            "INJECTING MALICIOUS PAYLOAD...",
            "TRACING ROUTE... 3 HOPS DETECTED",
            "DECRYPTING TRAFFIC... 100%",
            "EXTRACTING TARGET IP..."
        ];

        function typeLogs() {
            let delay = 0;
            logMessages.forEach((msg) => {
                setTimeout(() => {
                    terminalLog.innerHTML += msg + "<br>";
                    terminalLog.scrollTop = terminalLog.scrollHeight;
                }, delay);
                delay += 700;
            });
        }

        // --- POBIERANIE IP ---
        async function fetchIP() {
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                let ip = data.ip;
                let currentIp = "";
                
                // Efekt maszyny do pisania dla IP (uruchamia się po wejściu na ekran IP)
                setTimeout(() => {
                    for (let i = 0; i < ip.length; i++) {
                        setTimeout(() => {
                            currentIp += ip[i];
                            ipDisplay.innerText = currentIp;
                        }, i * 100);
                    }
                    
                    // Po wypisaniu IP odpal pasek postępu
                    setTimeout(startProgress, ip.length * 100 + 500);
                }, 500);
            } catch (error) {
                ipDisplay.innerText = "CONNECTION ERROR";
            }
        }

        // --- ANIMACJA PASKA POSTĘPU (PO ZŁAPANIU) ---
        function startProgress() {
            let width = 0;
            const interval = setInterval(() => {
                if (width >= 100) {
                    clearInterval(interval);
                    dataExtraction.style.opacity = 1; // Pokaż pobrane dane
                } else {
                    width += 5;
                    progressBar.style.width = width + '%';
                }
            }, 50);
        }

        // --- KLIK PRZYCISKU ---
        enterBtn.addEventListener('click', () => {
            welcomeScreen.style.display = 'none';
            animationScreen.style.display = 'flex';
            
            // Zmiana matrixa na agresywny czerwony i szybki
            matrixColor = "#ff003c";
            matrixSpeed = 1.5;
            matrixCanvas.style.opacity = 0.5;

            document.body.classList.add('shake');
            playTuffSound();
            typeLogs();
            fetchIP();

            // Po 7 sekundach pokaż IP
            setTimeout(() => {
                document.body.classList.remove('shake');
                animationScreen.style.display = 'none';
                ipContainer.style.display = 'block';
                
                // Mocny błysk przy przejściu
                document.body.style.backgroundColor = "#fff";
                setTimeout(() => document.body.style.backgroundColor = "#000", 50);
                
                // Przywróć spokojny matrix w tle
                matrixColor = "#330000";
                matrixSpeed = 0.5;
                matrixCanvas.style.opacity = 0.3;
            }, 7000);
        });

    </script>
</body>
</html>
